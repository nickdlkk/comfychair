name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Test and build shrunk release APK
        run: |
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --max-workers=2
          python3 - <<'PY'
          import json
          import pathlib
          import shutil
          metadata = pathlib.Path('app/build/outputs/apk/release/output-metadata.json')
          elements = json.loads(metadata.read_text())['elements']
          if len(elements) != 1:
              raise SystemExit('Expected one universal release APK')
          apk = metadata.parent / elements[0]['outputFile']
          shutil.copy2(apk, 'comfychair-${{ github.ref_name }}-release-ci.apk')
          PY

      - name: Test companion extension in isolation
        run: |
          python3 -m pip install pytest pytest-asyncio aiohttp
          python3 -m pytest server/tests -q --junitxml=server-test-results.xml

      - name: Preserve R8 mapping and test reports
        uses: actions/upload-artifact@v4
        with:
          name: release-build-evidence
          path: |
            app/build/outputs/mapping/release/
            app/build/test-results/testDebugUnitTest/
            server-test-results.xml
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Upload APK to existing release (idempotent)
          gh release upload "${{ github.ref_name }}" "comfychair-${{ github.ref_name }}-release-ci.apk" --clobber
